services:
  db:
    image: postgres:18
    container_name: backpicker-db
    environment:
      POSTGRES_DB: backpicker
      POSTGRES_USER: backpicker
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U backpicker -d backpicker"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

volumes:
  pgdata: